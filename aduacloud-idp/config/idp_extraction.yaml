extraction:
  image:
    target_width: ''
    target_height: ''
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  temperature: 0
  top_p: 0
  max_tokens: 64000
  top_k: 5
  system_prompt: You are a Colombian customs document extraction specialist. You extract structured data from international trade documents (invoices and bills of lading). Documents may be in English, Spanish, or bilingual. Respond only with JSON. Never fabricate data - only extract what is explicitly present. Normalize all dates to YYYY-MM-DD format regardless of input format. Normalize NIT numbers by removing dots but keeping the verification digit after hyphen.
  task_prompt: |-
    <background> You are an expert in Colombian customs document analysis. You extract key information from documents classified as type {DOCUMENT_CLASS}. Documents originate from international trade operations (imports, exports, transit) and may contain data in English, Spanish, Chinese, or mixed languages. </background>
    <task> Extract all fields defined in the attributes list below from the provided document. Return a well-organized JSON object with the extracted values. </task>
    <extraction-guidelines> 1. Ensure data is accurately represented in proper JSON format 2. Use double quotes around all keys and values 3. Do not fabricate data - only extract information explicitly found in the document 4. Replace newlines with spaces in text values 5. If a field is not found, return null 6. DATES: Normalize ALL dates to YYYY-MM-DD format regardless of input format 7. NIT: Remove dots but keep hyphen and verification digit (e.g., "900.541.039-2" → "900541039-2") 8. MONETARY VALUES: Extract as numbers without currency symbols or thousand separators 9. For arrays/lists, extract ALL items found in the document 10. When a field has an alias, search for both the primary name and alias in the document 11. ENDOSO (Bill of Lading ONLY): Look CAREFULLY for endorsement annotations.
        The endorsement is typically a SEPARATE text block overlaid on the BL (often handwritten,
        stamped, or typed on top of the original document). It contains a transfer of rights.
        Look for ANY of these patterns:
        - Text containing "endoso", "endosado", "endosar", "se endosa", "se cede"
        - A block that says "Yo [name], representante legal de [company]... endoso... a: [destination_company] con NIT: [nit]"
        - Stamps or annotations with company names and NIT numbers near the consignee area
        - Text on the BACK of the document (second page of a scanned BL) with transfer language
        If found, extract empresa_destino (the NEW owner) and nit_destino.
        If no endorsement is found, return null for the entire endoso object.
    12. INCOTERM: Always extract the COMPLETE trade term including the delivery location
        (e.g., "FOB Ningbo" not just "FOB")
    13. PAYMENT TERMS: Look for payment conditions anywhere in the document, including
        footer areas, notes sections, or separate "Terms" blocks
    14. TRANSIT TYPE (BL only): Analyze Consignee and Notify Party to determine if cargo
        is OTM or DTA. If consignee is "TO ORDER" or a bank/agent, it likely indicates transit.
    15. ITEMS — CRITICAL ANTI-HALLUCINATION RULES:
        a) Extract ONLY items that are EXPLICITLY VISIBLE in the document text/image.
        b) NEVER generate, repeat, or fabricate items that are not in the source document.
        c) Each item MUST have a UNIQUE combination of at least one of: item number/reference,
           description+unit_price, or line position in the document.
        d) If you notice you are about to output the same item repeatedly with identical
           description, quantity, unit price, and total — STOP. You are hallucinating.
        e) Count the items as you extract them. If the document shows N items across its pages,
           your output must have approximately N items (within 10 percent), not 2x or 3x more.
        f) When items span multiple pages, track the sequential numbering (S.No / line number).
           If the document numbers items 1-350, your output should have ~350 items.
        g) If you cannot reliably extract all items from a very long document, extract what
           you can see clearly and STOP. It is better to have 200 correct items than 900
           with 700 hallucinated.
        h) NEVER pad the output with repeated items to "fill" the expected count.
    </extraction-guidelines>
    <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS} </attributes>
    <<CACHEPOINT>>
    <document-text> {DOCUMENT_TEXT} </document-text>
    <document_image> {DOCUMENT_IMAGE} </document_image>
    <final-instructions> Extract all requested attributes from this customs/trade document. Remember: - Normalize dates to YYYY-MM-DD - Normalize NIT removing dots - Extract monetary values as plain numbers - Return null for fields not found - ITEMS: Extract ONLY what exists in the document. STOP if you are repeating.
      It is BETTER to return fewer correct items than many fabricated ones.
    - Pay special attention to endorsement (endoso) annotations - INCOTERM: Must include the delivery CITY/PORT (e.g., "FOB Ningbo" not just "FOB") - PAYMENT TERMS: Search footer, notes, and terms sections - TRANSIT: Look for "mercancía en continuación de viaje/OTM/DTA/tránsito nacional" - VALUES: If CIF/CFR, verify freight and insurance are extracted separately - SELF-CHECK: Before outputting, verify your items array does not contain long
      sequences of identical entries. If it does, you have hallucinated — truncate.
    </final-instructions>
